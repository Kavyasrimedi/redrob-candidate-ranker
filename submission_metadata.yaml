approach_summary: >
  Rule-based candidate ranking pipeline using weighted scoring across
  title trajectory, skill quality (proficiency + endorsements + duration),
  experience band fit, company type, and Redrob behavioral signals.
  Hard filters eliminate ~61% irrelevant candidates early. Honeypot
  detection zeros out 10 fabricated-experience profiles. Final score =
  raw_score * (1 - honeypot_penalty) * signal_multiplier.
